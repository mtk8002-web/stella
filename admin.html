<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070807"><title>NOIR ROYALE ADMIN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050605;color:#eee5d2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.wrap{width:min(100%,760px);margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #d8b15d33}.ey{font-size:8px;letter-spacing:.28em;color:#b99148}.top h1{margin:3px 0 0;font:600 29px Georgia;color:#f0d082}.card{margin-top:14px;padding:14px;border:1px solid #d8b15d38;border-radius:14px;background:linear-gradient(145deg,#101510,#080807)}.card h2{font:600 16px Georgia;color:#edce87;margin:0 0 12px}.muted{font-size:9px;color:#9b907c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:grid;gap:5px}.field label{font-size:8px;color:#9a907e}.field input,.field select{min-width:0;width:100%;padding:10px;border:1px solid #d7ad5830;border-radius:8px;background:#070907;color:#fff}.btn,.ghost,.danger{border-radius:999px;padding:10px 13px;border:1px solid #d8ae58}.btn{background:linear-gradient(#e6c46f,#9f702e);color:#140d05;font-weight:800}.ghost{background:#0c0e0c;color:#ead09a}.danger{border-color:#a34b55;background:#2d0c12;color:#ffbec5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.players{display:grid;gap:8px}.player{padding:11px;border:1px solid #d7ad5820;border-radius:11px;background:#070907}.playerHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.playerHead b{font:600 15px Georgia;color:#f0ce82}.meta{font-size:8px;color:#9c917f}.adjust{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:9px}.adjust input{width:100%;min-width:0;padding:8px;border:1px solid #d7ad5825;border-radius:7px;background:#0b0d0b;color:#fff}.roulette{display:grid;gap:9px}.rrow{display:grid;grid-template-columns:76px 1.3fr 1fr 70px 70px 86px auto;gap:6px;align-items:center;padding:8px;border:1px solid #d7ad5820;border-radius:10px;background:#070907}.pic{width:70px;height:70px;border-radius:9px;overflow:hidden;border:1px solid #d7ad5830;background:#0a0a09;display:grid;place-items:center;color:#817767;font-size:8px}.pic img{width:100%;height:100%;object-fit:contain}.rrow input,.rrow select{width:100%;min-width:0;padding:8px;border:1px solid #d7ad5825;border-radius:7px;background:#0b0d0b;color:#fff;font-size:9px}.picBtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.picBtns button{padding:5px 7px;font-size:8px}.headerPreview{width:100%;aspect-ratio:3/1;border-radius:12px;overflow:hidden;border:1px solid #d7ad5830;background:linear-gradient(135deg,#18080d,#0e2a20);display:grid;place-items:center;color:#9a8e77}.headerPreview img{width:100%;height:100%;object-fit:cover}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:9px;border-radius:999px;border:1px solid #d7ad582d;background:#090b09;color:#8f8575}.tabs .on{background:#174f3a;color:#f5dfb0}.tabs .sp.on{background:#601824}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(400px,100%);padding:24px;border:1px solid #d7ad5840;border-radius:14px;background:#0c100d}.loginBox h1{font:600 30px Georgia;color:#f0d082}.err,.ok{margin-top:10px;padding:9px;border-radius:8px;font-size:9px}.err{border:1px solid #9a3b46;background:#351018;color:#efb9bd}.ok{border:1px solid #456c54;background:#0c2417;color:#bce7c9}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionTitle span{font-size:8px;color:#a99369}.small{padding:7px 9px;font-size:8px}@media(max-width:680px){.grid,.g3{grid-template-columns:1fr}.adjust{grid-template-columns:repeat(3,1fr)}.adjust button{grid-column:1/-1}.rrow{grid-template-columns:72px 1fr 1fr}.rrow .wide{grid-column:2/-1}.rrow .del{grid-column:1/-1}.wrap{padding-bottom:40px}}
</style></head><body><div id="root"></div>
<script>
const API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-api';
const PIN_API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-pin-api';
const MEDIA='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-media-api';
let S=null,tab='normal';const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const token=()=>localStorage.getItem('nr_admin')||'';
async function call(url=API,method='GET',body){const r=await fetch(url,{method,headers:{'content-type':'application/json',...(token()?{authorization:'Bearer '+token()}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'エラー');return j}
function login(msg=''){root.innerHTML=`<main class="login"><section class="loginBox"><div class="ey">NOIR ROYALE</div><h1>ADMIN</h1><form id="lf" class="field"><label>ADMIN PASSWORD</label><input id="pw" type="password" required><button class="btn">LOGIN</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></section></main>`;$('#lf').onsubmit=async e=>{e.preventDefault();try{const j=await call(API,'POST',{action:'loginAdmin',password:$('#pw').value});localStorage.setItem('nr_admin',j.token);await load()}catch(x){login(x.message)}}}
function dt(v){if(!v)return'';const d=new Date(v),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function render(){if(!S?.event)return root.innerHTML='<div class="wrap"><div class="err">アクティブイベントがありません</div></div>';const e=S.event,items=(S.items||[]).filter(x=>x.roulette_type===tab);root.innerHTML=`<main class="wrap"><header class="top"><div><div class="ey">NOIR ROYALE</div><h1>CONTROL ROOM</h1></div><button id="logout" class="ghost small">LOGOUT</button></header>
<section class="card"><div class="sectionTitle"><h2>HEADER IMAGE</h2><span>参加者画面の最上部</span></div><div class="headerPreview">${e.header_image_url?`<img src="${esc(e.header_image_url)}">`:'NO HEADER IMAGE'}</div><div class="actions"><button id="headerUp" class="btn small">ヘッダー画像を設定</button><button id="headerDel" class="ghost small">削除</button><input id="headerFile" type="file" accept="image/*" hidden></div><div class="muted">推奨比率 3:1。アップロード時に自動で横長へ整形します。</div></section>
<section class="card"><h2>EVENT</h2><div class="grid"><div class="field"><label>EVENT NAME</label><input id="evName" value="${esc(e.name)}"></div><div class="field"><label>SPIN COST</label><input id="spinCost" type="number" value="${e.spin_cost}"></div><div class="field"><label>JACKPOT SEED</label><input id="jackSeed" type="number" value="${e.jackpot_seed}"></div><div class="field"><label>JACKPOT + / NORMAL SPIN</label><input id="jackAdd" type="number" value="${e.jackpot_contribution}"></div><div class="field"><label>START</label><input id="start" type="datetime-local" value="${dt(e.starts_at)}"></div><div class="field"><label>END</label><input id="end" type="datetime-local" value="${dt(e.ends_at)}"></div></div><div class="actions"><button id="saveEvent" class="btn">イベント設定を保存</button><button id="resetJack" class="ghost">JACKPOTを初期値へ</button><button id="resetScores" class="danger">全SCOREをリセット</button></div></section>
<section class="card"><div class="sectionTitle"><h2>PLAYERS</h2><span>${S.players.length} USERS</span></div><div class="grid"><div class="field"><label>DISPLAY NAME</label><input id="newName"></div><div class="field"><label>4 DIGIT PIN（空欄なら自動）</label><input id="newPin" inputmode="numeric" maxlength="4"></div></div><div class="actions"><button id="create" class="btn">ユーザー作成</button></div><div id="createMsg"></div><div class="players">${S.players.map(p=>`<article class="player" data-id="${p.id}"><div class="playerHead"><div><b>${esc(p.display_name)}</b><div class="meta">SCORE ${Number(p.score).toLocaleString()} / PT ${Number(p.spin_points).toLocaleString()} / SPECIAL ${p.special_tickets}</div></div><div class="actions" style="margin-top:0;justify-content:flex-end"><button class="ghost small resetPin" data-id="${p.id}" data-name="${esc(p.display_name)}">PIN再発行</button><button class="danger small deletePlayer" data-id="${p.id}" data-name="${esc(p.display_name)}">削除</button></div></div><div class="adjust"><input class="sd" type="number" placeholder="SPIN ±"><input class="td" type="number" placeholder="SPECIAL ±"><input class="sc" type="number" placeholder="SCORE ±"><button class="ghost apply" data-id="${p.id}">反映</button></div></article>`).join('')||'<div class="muted">ユーザーはいません</div>'}</div></section>
<section class="card"><div class="sectionTitle"><h2>ROULETTE</h2><span>画像は各景品に保存</span></div><div class="tabs"><button id="nt" class="${tab==='normal'?'on':''}">STANDARD</button><button id="st" class="sp ${tab==='special'?'on':''}">SPECIAL</button></div><div id="rouletteRows" class="roulette">${items.map((it,i)=>row(it,i)).join('')}</div><div class="actions"><button id="addRow" class="ghost">マスを追加</button><button id="saveRoulette" class="btn">${tab==='normal'?'STANDARD':'SPECIAL'}を保存</button></div><div class="muted">新規マスは一度保存してから画像を添付してください。</div></section><div id="msg"></div></main>`;bind()}
function row(it,i){return `<div class="rrow" data-id="${it.id||''}"><div><div class="pic">${it.reward_image_url?`<img src="${esc(it.reward_image_url)}">`:'NO IMAGE'}</div><div class="picBtns"><button class="ghost upImg small" data-id="${it.id||''}">画像</button>${it.reward_image_url?`<button class="danger rmImg small" data-id="${it.id}">×</button>`:''}<input class="imgFile" type="file" accept="image/*" hidden></div></div><input class="lbl wide" value="${esc(it.label||'NEW ITEM')}"><select class="kind"><option value="score" ${it.reward_kind==='score'?'selected':''}>SCORE</option><option value="multiplier" ${it.reward_kind==='multiplier'?'selected':''}>NEXT倍率</option><option value="free_spin" ${it.reward_kind==='free_spin'?'selected':''}>FREE</option><option value="special_ticket" ${it.reward_kind==='special_ticket'?'selected':''}>SPECIAL券</option><option value="jackpot" ${it.reward_kind==='jackpot'?'selected':''}>JACKPOT</option><option value="collection" ${it.reward_kind==='collection'?'selected':''}>COLLECTION</option></select><input class="val" type="number" value="${it.value??0}" title="VALUE"><input class="wt" type="number" step="0.1" value="${it.weight??1}" title="WEIGHT"><select class="rar"><option value="common" ${it.rarity==='common'?'selected':''}>COMMON</option><option value="rare" ${it.rarity==='rare'?'selected':''}>RARE</option><option value="epic" ${it.rarity==='epic'?'selected':''}>EPIC</option><option value="legend" ${it.rarity==='legend'?'selected':''}>LEGEND</option></select><button class="danger del small">削除</button></div>`}
function bind(){
$('#logout').onclick=async()=>{try{await call(API,'POST',{action:'logoutAdmin'})}catch{}localStorage.removeItem('nr_admin');login()};
$('#saveEvent').onclick=async()=>{try{await call(API,'POST',{action:'updateEvent',patch:{name:$('#evName').value,spin_cost:+$('#spinCost').value,jackpot_seed:+$('#jackSeed').value,jackpot_contribution:+$('#jackAdd').value,starts_at:$('#start').value,ends_at:$('#end').value}});note('イベント設定を保存しました');await load()}catch(e){note(e.message,false)}};
$('#resetJack').onclick=async()=>{if(!confirm('JACKPOTを初期値に戻しますか？'))return;try{await call(API,'POST',{action:'resetJackpot'});await load()}catch(e){note(e.message,false)}};
$('#resetScores').onclick=async()=>{if(!confirm('全ユーザーのSCOREを0にします。実行しますか？'))return;try{await call(API,'POST',{action:'resetScores'});await load()}catch(e){note(e.message,false)}};
$('#create').onclick=async()=>{try{const j=await call(API,'POST',{action:'createPlayer',displayName:$('#newName').value,pin:$('#newPin').value});$('#createMsg').innerHTML=`<div class="ok">作成完了：${esc(j.player.display_name)} / PIN ${esc(j.pin)}</div>`;setTimeout(load,1200)}catch(e){$('#createMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`}};
$$('.apply').forEach(b=>b.onclick=async()=>{const a=b.closest('.player');try{await call(API,'POST',{action:'adjustPlayer',playerId:b.dataset.id,spinDelta:+(a.querySelector('.sd').value||0),specialDelta:+(a.querySelector('.td').value||0),scoreDelta:+(a.querySelector('.sc').value||0)});await load()}catch(e){note(e.message,false)}});
$$('.resetPin').forEach(b=>b.onclick=async()=>{const entered=prompt(`${b.dataset.name} の新しい4桁PINを入力してください。\n空欄のままOKで自動生成します。`,'');if(entered===null)return;const pin=entered.trim();if(pin&&!/^\d{4}$/.test(pin)){note('PINは4桁の数字にしてください',false);return}try{const j=await call(PIN_API,'POST',{action:'resetPlayerPin',playerId:b.dataset.id,pin});let copied=false;try{await navigator.clipboard.writeText(j.pin);copied=true}catch{}alert(`${b.dataset.name} の新しいPINは ${j.pin} です。${copied?'\nクリップボードにコピーしました。':'\nこの番号を参加者に伝えてください。'}`);note(`${b.dataset.name} のPINを再発行しました`)}catch(e){note(e.message,false)}});
$$('.deletePlayer').forEach(b=>b.onclick=async()=>{if(!confirm(`${b.dataset.name} を削除します。\n当選履歴・ポイント履歴・ログイン情報も削除されます。実行しますか？`))return;try{await call(API,'POST',{action:'deletePlayer',playerId:b.dataset.id});note(`${b.dataset.name} を削除しました`);await load()}catch(e){note(e.message,false)}});
$('#nt').onclick=()=>{tab='normal';render()};$('#st').onclick=()=>{tab='special';render()};
$('#addRow').onclick=()=>{$('#rouletteRows').insertAdjacentHTML('beforeend',row({id:'',label:'NEW ITEM',reward_kind:'score',value:10,weight:1,rarity:'common'},99));bindRowButtons()};
$('#saveRoulette').onclick=saveRoulette;bindRowButtons();
$('#headerUp').onclick=()=>$('#headerFile').click();$('#headerFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=await resizeHeader(f);await call(MEDIA,'POST',{action:'uploadHeaderImage',imageData:d});note('ヘッダー画像を更新しました');await load()}catch(x){note(x.message,false)}e.target.value=''};
$('#headerDel').onclick=async()=>{if(!confirm('ヘッダー画像を削除しますか？'))return;try{await call(MEDIA,'POST',{action:'removeHeaderImage'});await load()}catch(e){note(e.message,false)}};
}
function bindRowButtons(){
$$('.rrow .del').forEach(b=>b.onclick=()=>b.closest('.rrow').remove());
$$('.upImg').forEach(b=>b.onclick=()=>{if(!b.dataset.id){note('先にルーレット設定を保存してください',false);return}b.parentElement.querySelector('.imgFile').click()});
$$('.imgFile').forEach(inp=>inp.onchange=async e=>{const f=e.target.files?.[0],id=e.target.parentElement.querySelector('.upImg').dataset.id;if(!f||!id)return;try{const d=await resizeSquare(f);await call(MEDIA,'POST',{action:'uploadRewardImage',itemId:id,imageData:d});note('景品画像を保存しました');await load()}catch(x){note(x.message,false)}e.target.value=''});
$$('.rmImg').forEach(b=>b.onclick=async()=>{try{await call(MEDIA,'POST',{action:'removeRewardImage',itemId:b.dataset.id});await load()}catch(e){note(e.message,false)}})
}
async function saveRoulette(){const items=$$('.rrow').map(r=>({id:r.dataset.id||null,label:r.querySelector('.lbl').value,reward_kind:r.querySelector('.kind').value,value:+r.querySelector('.val').value,weight:+r.querySelector('.wt').value,rarity:r.querySelector('.rar').value}));try{await call(MEDIA,'POST',{action:'saveRouletteV2',rouletteType:tab,items});note('ルーレット設定を保存しました');await load()}catch(e){note(e.message,false)}}
function resizeSquare(file){return resize(file,512,512,.84,'contain')}
function resizeHeader(file){return resize(file,1200,400,.86,'cover')}
function resize(file,W,H,q,mode){return new Promise((res,rej)=>{const rd=new FileReader;rd.onload=()=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#080807';x.fillRect(0,0,W,H);const sc=mode==='cover'?Math.max(W/im.width,H/im.height):Math.min(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
function note(t,ok=true){let el=$('#msg');if(!el)return;el.innerHTML=`<div class="${ok?'ok':'err'}">${esc(t)}</div>`;setTimeout(()=>{if(el)el.innerHTML=''},2500)}
async function load(){try{S=await call(API+'?mode=admin');render()}catch(e){localStorage.removeItem('nr_admin');login(e.message)}}
load();
</script></body></html>
