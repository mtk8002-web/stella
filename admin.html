<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070807"><title>Noir Royale Admin</title><style>
*{box-sizing:border-box}html{background:#070807;color-scheme:dark}body{margin:0;background:radial-gradient(circle at 50% -10%,#5d15202e,transparent 30%),#070807;color:#f3ead5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.wrap{width:min(100%,900px);margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between;align-items:end;padding-bottom:14px;border-bottom:1px solid #d7ad5833}.top span{font-size:8px;letter-spacing:.25em;color:#b9924a}.top h1{margin:3px 0 0;font:600 28px Georgia;color:#f0d082}.logout{border:1px solid #d5ad5633;background:#0b0d0b;color:#ad9f85;border-radius:8px;padding:8px 11px}.card{margin-top:13px;padding:14px;border:1px solid #d7ad5838;border-radius:12px;background:linear-gradient(145deg,#101611,#080a08)}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:10px;letter-spacing:.1em;color:#e0c98f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px;border:1px solid #d7ad5824;border-radius:9px;background:#070907}.stat small{display:block;color:#8f8472;font-size:8px}.stat strong{font:600 24px Georgia;color:#edcd80}.form{display:grid;gap:9px}.form label{display:grid;gap:5px;font-size:8px;color:#9b907c;letter-spacing:.08em}.form input,.form select{width:100%;padding:10px;border:1px solid #d7ad5830;border-radius:8px;background:#070907;color:#f3ead5}.btn{padding:10px 12px;border:1px solid #d9b25f;border-radius:999px;background:linear-gradient(#e9c874,#a7762d);color:#130e06;font-weight:900}.dark{background:#0a100c;color:#d7c7a7;border-color:#d7ad5833}.red{background:#3f1219!important;color:#efc4c4!important;border-color:#9a3b46!important}.players{display:grid;gap:8px}.prow{padding:10px;border:1px solid #d7ad5825;border-radius:9px;background:#090b09}.phead{display:flex;justify-content:space-between;gap:10px;align-items:center}.phead b{font-size:12px}.phead span{font:600 15px Georgia;color:#e8c87d}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acts button{padding:7px 9px;border-radius:8px;border:1px solid #d7ad5830;background:#0d120e;color:#d8c7a6;font-size:9px}.acts .sp{border-color:#b65a6745;color:#e2a8ad}.editor{display:grid;gap:7px}.erow{display:grid;grid-template-columns:1.5fr 1fr .7fr .7fr .8fr 38px;gap:6px}.erow input,.erow select{min-width:0;padding:8px;border:1px solid #d7ad5829;border-radius:6px;background:#070907;color:#eee2c9;font-size:9px}.erow button{border:1px solid #8d3540;background:#391016;color:#e2adb2;border-radius:6px}.tabs{display:flex;gap:7px;margin-bottom:10px}.tabs button{padding:8px 12px;border:1px solid #d7ad5830;border-radius:999px;background:#080a08;color:#8e8472}.tabs .on{background:#1a4e3a;color:#f1dfb5}.msg{position:sticky;bottom:10px;margin-top:10px;padding:10px;border:1px solid #c9a15455;border-radius:9px;background:#142219;color:#dfc988;font-size:10px}.err{border-color:#9a3b46;background:#351018;color:#efb9bd}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:26px}.login h1{font:600 29px Georgia;color:#f0d082}.muted{color:#8d8373;font-size:9px}@media(max-width:620px){.grid3{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.erow{grid-template-columns:1.5fr 1fr .7fr}.top h1{font-size:23px}}
</style></head><body><div id="root"></div><script>
const API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-api';let A=null,tab='normal';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const dtlocal=x=>{const d=new Date(x),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())};const token=()=>localStorage.getItem('nr_admin')||'';
async function req(method='GET',body,mode=''){const r=await fetch(API+(mode?'?mode='+mode:''),{method,headers:{'content-type':'application/json',...(token()?{authorization:'Bearer '+token()}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'エラー');return j}function msg(t,e=false){let m=$('#msg');if(m){m.className='msg'+(e?' err':'');m.textContent=t}}
async function load(){try{A=await req('GET',null,'admin');render()}catch{localStorage.removeItem('nr_admin');login()}}
function login(){document.getElementById('root').innerHTML=`<main class="login"><section class="card"><span class="muted">NOIR ROYALE</span><h1>ADMIN</h1><form id="af" class="form"><label>ADMIN PASSWORD<input id="pw" type="password" required></label><button class="btn">LOGIN</button><div id="msg"></div></form></section></main>`;$('#af').onsubmit=async e=>{e.preventDefault();try{const j=await req('POST',{action:'loginAdmin',password:$('#pw').value});localStorage.setItem('nr_admin',j.token);load()}catch(x){document.getElementById('msg').innerHTML='<div class="msg err">'+esc(x.message)+'</div>'}}}
function row(x){return `<div class="erow"><input class="lab" value="${esc(x.label)}"><select class="kind"><option ${x.reward_kind==='score'?'selected':''} value="score">SCORE</option><option ${x.reward_kind==='multiplier'?'selected':''} value="multiplier">NEXT倍率</option><option ${x.reward_kind==='free_spin'?'selected':''} value="free_spin">FREE SPIN</option><option ${x.reward_kind==='special_ticket'?'selected':''} value="special_ticket">SPECIAL券</option><option ${x.reward_kind==='jackpot'?'selected':''} value="jackpot">JACKPOT</option><option ${x.reward_kind==='collection'?'selected':''} value="collection">COLLECTION</option></select><input class="val" type="number" min="0" value="${x.value}"><input class="weight" type="number" min="0.01" step="0.01" value="${x.weight}"><select class="rar"><option ${x.rarity==='common'?'selected':''}>common</option><option ${x.rarity==='rare'?'selected':''}>rare</option><option ${x.rarity==='epic'?'selected':''}>epic</option><option ${x.rarity==='legend'?'selected':''}>legend</option></select><button class="del">×</button></div>`}
function render(){const e=A.event,players=A.players||[],items=(A.items||[]).filter(x=>x.roulette_type===tab);document.getElementById('root').innerHTML=`<main class="wrap"><header class="top"><div><span>NOIR ROYALE</span><h1>ADMIN CONTROL</h1></div><button class="logout" id="lo">LOGOUT</button></header><section class="grid3"><div class="stat"><small>PLAYERS</small><strong>${players.length}</strong></div><div class="stat"><small>JACKPOT</small><strong>${Number(e.jackpot_current).toLocaleString()}</strong></div><div class="stat"><small>SPIN COST</small><strong>${e.spin_cost}</strong></div></section><section class="card"><div class="title"><strong>PLAYER</strong><span>作成・ポイント付与</span></div><form id="newp" class="grid"><label class="form">表示名<input id="name" required></label><label class="form">4桁PIN（空欄で自動）<input id="ppin" inputmode="numeric" maxlength="4"></label><button class="btn" style="grid-column:1/-1">ユーザー作成</button></form><div class="players" style="margin-top:12px">${players.map(p=>`<div class="prow"><div class="phead"><b>${esc(p.display_name)}</b><span>${Number(p.score).toLocaleString()} SCORE</span></div><div class="muted">${Number(p.spin_points).toLocaleString()} PT / SPECIAL ${p.special_tickets}</div><div class="acts"><button data-a="adjust" data-id="${p.id}" data-p="100">+100pt</button><button data-a="adjust" data-id="${p.id}" data-p="500">+500pt</button><button data-a="adjust" data-id="${p.id}" data-p="1000">+1000pt</button><button class="sp" data-a="adjust" data-id="${p.id}" data-s="1">SPECIAL +1</button></div></div>`).join('')}</div></section><section class="card"><div class="title"><strong>EVENT</strong><span>期間・基本設定</span></div><form id="eventf" class="form"><div class="grid"><label>イベント名<input id="ename" value="${esc(e.name)}"></label><label>1回の必要pt<input id="cost" type="number" min="1" value="${e.spin_cost}"></label><label>開始日時<input id="start" type="datetime-local" value="${dtlocal(e.starts_at)}"></label><label>終了日時<input id="end" type="datetime-local" value="${dtlocal(e.ends_at)}"></label><label>JACKPOT初期値<input id="seed" type="number" min="0" value="${e.jackpot_seed}"></label><label>1回ごとのJACKPOT加算<input id="contrib" type="number" min="0" value="${e.jackpot_contribution}"></label></div><button class="btn">設定保存</button></form><div class="acts"><button id="rj">JACKPOTリセット</button><button class="red" id="rs">ランキングリセット</button></div></section><section class="card"><div class="title"><strong>ROULETTE</strong><span>内容・確率</span></div><div class="tabs"><button id="tn" class="${tab==='normal'?'on':''}">STANDARD</button><button id="ts" class="${tab==='special'?'on':''}">SPECIAL</button></div><div class="editor" id="ed">${items.map(row).join('')}</div><div class="acts"><button id="add">項目追加</button><button class="btn" id="save">このルーレットを保存</button></div></section><section class="card"><div class="title"><strong>SECURITY</strong><span>管理パスワード</span></div><form id="passf" class="grid"><label class="form">新しいパスワード<input id="npw" type="password" minlength="8" required></label><button class="btn">変更</button></form></section><div id="msg" class="msg">READY</div></main>`;bind()}
function bind(){$('#lo').onclick=async()=>{try{await req('POST',{action:'logoutAdmin'})}catch{}localStorage.removeItem('nr_admin');login()};$('#newp').onsubmit=async e=>{e.preventDefault();try{const j=await req('POST',{action:'createPlayer',displayName:$('#name').value,pin:$('#ppin').value});alert('作成しました\n表示名: '+j.player.display_name+'\nPIN: '+j.pin);load()}catch(x){msg(x.message,true)}};document.querySelectorAll('[data-a="adjust"]').forEach(b=>b.onclick=async()=>{try{await req('POST',{action:'adjustPlayer',playerId:b.dataset.id,spinDelta:Number(b.dataset.p||0),specialDelta:Number(b.dataset.s||0)});load()}catch(x){msg(x.message,true)}});$('#eventf').onsubmit=async ev=>{ev.preventDefault();try{await req('POST',{action:'updateEvent',patch:{name:$('#ename').value,spin_cost:Number($('#cost').value),starts_at:new Date($('#start').value).toISOString(),ends_at:new Date($('#end').value).toISOString(),jackpot_seed:Number($('#seed').value),jackpot_contribution:Number($('#contrib').value)}});load()}catch(x){msg(x.message,true)}};$('#rj').onclick=async()=>{await req('POST',{action:'resetJackpot'});load()};$('#rs').onclick=async()=>{if(confirm('全員のランキングSCOREを0にしますか？')){await req('POST',{action:'resetScores'});load()}};$('#tn').onclick=()=>{tab='normal';render()};$('#ts').onclick=()=>{tab='special';render()};$('#add').onclick=()=>{$('#ed').insertAdjacentHTML('beforeend',row({label:'NEW',reward_kind:'score',value:10,weight:10,rarity:'common'}));bindEditor()};bindEditor();$('#save').onclick=async()=>{try{const arr=[...document.querySelectorAll('.erow')].map(r=>({label:r.querySelector('.lab').value,reward_kind:r.querySelector('.kind').value,value:Number(r.querySelector('.val').value),weight:Number(r.querySelector('.weight').value),rarity:r.querySelector('.rar').value}));await req('POST',{action:'saveRoulette',rouletteType:tab,items:arr});msg('保存しました');load()}catch(x){msg(x.message,true)}};$('#passf').onsubmit=async e=>{e.preventDefault();try{await req('POST',{action:'changeAdminPassword',password:$('#npw').value});msg('管理パスワードを変更しました');$('#npw').value=''}catch(x){msg(x.message,true)}}}
function bindEditor(){document.querySelectorAll('.del').forEach(b=>b.onclick=()=>b.closest('.erow').remove())}
load();
</script></body></html>
