<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOIR ROYALE</title><style>html,body{margin:0;width:100%;height:100%;background:#050605}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050605}</style></head><body><iframe id="app" src="./?v=202609061239"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,s=d.createElement('style');s.textContent='.wheel-label{stroke-width:6px!important}.wheel-label.score{font:800 68px Georgia!important}.wheel-label.multi{font:800 38px Georgia!important}.wheel-label.text,.wheel-label.special,.wheel-label.free,.wheel-label.collection{font:800 35px Georgia!important}.jack-label{font:900 44px Georgia!important;stroke-width:8px!important}.hub{color:transparent!important;font-size:0!important;letter-spacing:0!important}@media(max-width:390px){.wheel-label.score{font-size:56px!important}.wheel-label.multi{font-size:31px!important}.wheel-label.text,.wheel-label.special,.wheel-label.free,.wheel-label.collection{font-size:29px!important}.jack-label{font-size:34px!important}}';d.head.appendChild(s);const sc=d.createElement('script');sc.textContent=`function splitWheelLabel(label){const t=String(label||'').replace(/\\s+/g,' ').trim();if(!t)return['ITEM'];if(t.length<=7)return[t];if(t.length<=12)return[t.slice(0,6),t.slice(6)];return[t.slice(0,6),t.slice(6,11)+'…']}function wheelTextSpec(it){const v=Number(it.value||0);switch(it.reward_kind){case 'score':return {lines:[String(v)],cls:'score'};case 'multiplier':return {lines:['NEXT',\`×\${v||2}\`],cls:'multi'};case 'free_spin':return {lines:['FREE'],cls:'free'};case 'special_ticket':return {lines:['SPECIAL'],cls:'special'};case 'jackpot':return {lines:['JACKPOT'],cls:'jackpot'};case 'collection':return {lines:splitWheelLabel(it.label||'COLLECT'),cls:'collection'};default:return {lines:splitWheelLabel(it.label),cls:'text'}}}function wheelTextNode(spec,x,y,mid,isJ){const lines=spec.lines||[''];const firstDy=lines.length===1?0:-20;return \`<text class=\\"wheel-label \${spec.cls} \${isJ?'jack-label':''}\\" x=\\"\${x}\\" y=\\"\${y}\\" transform=\\"rotate(\${mid} \${x} \${y})\\">\${lines.map((line,idx)=>\`<tspan x=\\"\${x}\\" dy=\\"\${idx===0?firstDy:34}\\">\${esc(line)}</tspan>\`).join('')}</text>\`}function wheel(items){if(!items.length)return '<div class=\\"empty\\">ルーレット設定がありません</div>';const st=360/items.length;let g='';items.forEach((it,i)=>{const a0=i*st,a1=(i+1)*st,mid=a0+st/2,p=polar(500,500,318,mid),isJ=it.reward_kind==='jackpot',fill=isJ?'url(#jackGrad)':it.rarity==='legend'?'#7a4b14':it.rarity==='epic'?'#4d1638':i%2?'#0d1110':'#7d1822',stroke=isJ?'#fff1a0':'#d1aa5a',sw=isJ?10:4,spec=wheelTextSpec(it);g+=\`<g><path d=\\"\${path(500,500,490,a0,a1)}\\" fill=\\"\${fill}\\" stroke=\\"\${stroke}\\" stroke-width=\\"\${sw}\\" \${isJ?'filter=\\"url(#jackGlow)\\"':''}/>\${wheelTextNode(spec,p[0],p[1],mid,isJ)}\${isJ?\`<circle class=\\"jack-star\\" cx=\\"\${polar(500,500,420,mid-4)[0]}\\" cy=\\"\${polar(500,500,420,mid-4)[1]}\\" r=\\"10\\"/>\`:''}</g>\`});return \`<div class=\\"wheelwrap\\"><div class=\\"pointer\\"></div><div class=\\"wheel-shell\\"><svg class=\\"wheel-svg\\" id=\\"wheel\\" viewBox=\\"0 0 1000 1000\\" style=\\"transform:rotate(\${rotation}deg)\\"><defs><linearGradient id=\\"jackGrad\\" x1=\\"0\\" x2=\\"1\\" y1=\\"0\\" y2=\\"1\\"><stop offset=\\"0\\" stop-color=\\"#5a1304\\"/><stop offset=\\".35\\" stop-color=\\"#ffb51e\\"/><stop offset=\\".55\\" stop-color=\\"#fff0a2\\"/><stop offset=\\".75\\" stop-color=\\"#ff8a00\\"/><stop offset=\\"1\\" stop-color=\\"#5e1002\\"/></linearGradient><filter id=\\"jackGlow\\"><feGaussianBlur stdDeviation=\\"8\\" result=\\"b\\"/><feMerge><feMergeNode in=\\"b\\"/><feMergeNode in=\\"SourceGraphic\\"/></feMerge></filter></defs>\${g}<circle cx=\\"500\\" cy=\\"500\\" r=\\"150\\" fill=\\"#1a120b\\" stroke=\\"#cfa85a\\" stroke-width=\\"18\\"/></svg><div class=\\"hub\\"></div></div></div>\`}if(S?.player)render();`;d.body.appendChild(sc)};</script></body></html>
