<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070807"><title>NOIR ROYALE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050605;color:#f4ead0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input{font:inherit}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:16px 13px 90px;background:radial-gradient(circle at 50% 0,#5d152030,transparent 26%),radial-gradient(circle at 50% 54%,#0b573d35,transparent 32%),linear-gradient(#080706,#07100c 55%,#050605)}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;padding:8px 0 14px;border-bottom:1px solid #d7ad5838}.ey{font-size:8px;letter-spacing:.28em;color:#b99148}.head h1{font:600 28px Georgia;margin:3px 0 0;color:#f1d084}.jack{min-width:115px;text-align:center;padding:8px;border:1px solid #d9ad58;border-radius:10px;background:linear-gradient(#48131a,#16080b)}.jack small{display:block;font:700 8px Georgia;color:#d6ac59}.jack strong{font:600 25px Georgia;color:#ffdda0}.topbtns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}.tiny{border:1px solid #d7ad5838;background:#0a0d0b;color:#a99d88;border-radius:999px;padding:7px 10px;font-size:8px}.pod{padding:22px 0 8px}.plabel{text-align:center;font:700 9px Georgia;letter-spacing:.22em;color:#cfa85b;margin-bottom:12px}.pgrid{display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:5px}.p{height:136px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:50px 5px 12px;border:1px solid #c79c4e55;border-radius:48px 48px 10px 10px;background:linear-gradient(#211912,#090807)}.p.one{height:166px;border-color:#edc466b5;background:linear-gradient(#4a2b10,#150c07)}.ava{position:absolute;top:-5px;width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #a17b3c;background:#111}.one .ava{width:80px;height:80px;top:-8px;border-color:#e4ba61}.ava img{width:100%;height:100%;object-fit:cover}.ava svg{width:60%;height:60%;margin:20%}.p b{font:600 12px Georgia;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p strong{font:600 22px Georgia;color:#f0ce82}.one strong{font-size:29px}.medal{position:absolute;top:52px;border-radius:999px;padding:3px 10px;background:linear-gradient(#ecc96f,#996725);color:#140d06;font:700 14px Georgia}.one .medal{top:67px}.status,.panel,.mypage{margin-top:12px;border:1px solid #d7ad583d;border-radius:14px;background:linear-gradient(145deg,#0e1510,#070807);padding:13px}.who{display:flex;align-items:center;gap:10px}.meava{width:46px;height:46px;position:relative;inset:auto}.who small{display:block;color:#908675;font-size:8px}.who p{margin:0}.who p strong{font:600 24px Georgia;color:#f0ce82}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{padding:10px 6px;text-align:center;border:1px solid #d7ad5824;border-radius:9px;background:#070907}.stat small{display:block;font-size:7px;color:#8e8473}.stat strong{font:600 18px Georgia;color:#edcd80}.table{margin-top:14px;padding:15px 8px 14px;border:1px solid #dcb7624d;border-radius:18px;background:radial-gradient(circle at 50% 43%,#14583f60,transparent 52%),linear-gradient(#062b1e,#04140e)}.tabs{width:230px;margin:auto;padding:3px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddb96d33;border-radius:999px;background:#07130e}.tabs button{border:0;background:none;color:#827968;padding:8px;border-radius:999px;font-size:8px}.tabs .on{background:#174f3a;color:#f1deb5}.tabs .special.on{background:#5e1b26}.wheelwrap{width:min(82vw,390px);aspect-ratio:1;margin:27px auto 22px;position:relative}.wheelwrap:before{content:"";position:absolute;inset:-13px;border-radius:50%;border:7px solid #17100a;box-shadow:inset 0 0 0 2px #c79b52,0 0 0 2px #e0bc72;z-index:-1}.pointer{position:absolute;z-index:5;left:50%;top:-23px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:33px solid #edc56d}.wheel-shell{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid #dfbd77;background:#13090d;position:relative}.wheel-svg{width:100%;height:100%;display:block;transform-origin:50% 50%;transition:transform 2.6s cubic-bezier(.13,.72,.12,1)}.wheel-label{fill:#f8ebc9;font:600 31px Georgia;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#000;stroke-width:5px}.hub{position:absolute;inset:39%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#b8863d,#20140b 66%);border:2px solid #edcf88;color:#ffe6ae;font:600 11px Georgia;letter-spacing:.12em}.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}.actions button{min-height:60px;border-radius:13px;border:1px solid #dcab55;color:#ffe3a2}.spin{background:linear-gradient(#9e222d,#691019)}.specialbtn{background:linear-gradient(#2b1a14,#090907)}.actions small{display:block;font-size:7px}.actions strong{font:600 16px Georgia}.actions button:disabled{opacity:.35}.sect{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid #e2bd6a1c}.sect strong{font-size:10px}.sect span{font-size:7px;color:#c75c62}.row{display:grid;grid-template-columns:35px 32px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #e2bd6a10}.mini{position:relative;inset:auto;width:31px;height:31px;border-width:1px}.row b{font:600 11px Georgia;color:#c4ad76}.row span{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row strong{font:600 14px Georgia;color:#efcf86}.recent{font-size:9px}.recent div{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid #e2bd6a10}.profile{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}.profile .big{position:relative;inset:auto;width:82px;height:82px}.profile h3{margin:0;font:600 22px Georgia;color:#f0ce82}.profile p{margin:5px 0;color:#8e8575;font-size:9px}.myactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.ghost{border:1px solid #d5a95466;border-radius:999px;background:#110f0d;color:#ebcf93;padding:8px 10px;font-size:9px}.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:#070807ed;border-top:1px solid #d7ad5830;backdrop-filter:blur(12px)}.nav a{text-decoration:none;color:#8c8374;display:grid;place-items:center;font-size:8px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#050605}.loginbox{width:min(420px,100%);padding:26px;border:1px solid #d7ad5840;border-radius:16px;background:linear-gradient(#11160f,#080807)}.login h1{font:600 31px Georgia;color:#f0d082}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;font-size:8px;color:#9b907c}.form input{padding:12px;border:1px solid #d7ad5830;border-radius:9px;background:#070907;color:#fff}.btn{padding:12px;border:1px solid #d9b25f;border-radius:999px;background:linear-gradient(#e9c874,#a7762d);color:#130e06;font-weight:900}.err{margin-top:9px;padding:9px;border:1px solid #9a3b46;border-radius:8px;background:#351018;color:#efb9bd;font-size:9px}.overlay{position:fixed;z-index:100;inset:0;background:#000d;display:grid;place-items:center;padding:18px}.result{width:min(390px,100%);padding:24px;text-align:center;border:1px solid #d8ae5d;border-radius:18px;background:radial-gradient(circle at 50% 20%,#7a4e2030,transparent 36%),linear-gradient(#18130e,#080706);box-shadow:0 0 60px #d6a64f30}.result small{font-size:9px;letter-spacing:.2em;color:#d2aa57}.result h2{font:600 30px Georgia;color:#f5d58b;margin:12px 0 5px}.result p{margin:6px 0;color:#c7bca5}.result button{margin-top:15px;padding:10px 22px;border:1px solid #d9b25f;border-radius:999px;background:linear-gradient(#e9c874,#a7762d);color:#130e06;font-weight:900}.rewardart{width:190px;height:190px;margin:12px auto;border-radius:18px;overflow:hidden;border:1px solid #e0b96755;background:#090907}.rewardart img{width:100%;height:100%;object-fit:contain}.empty{text-align:center;color:#746b5e;padding:13px;font-size:9px}.count{font-size:8px;color:#9e927c;margin-top:5px}@media(max-width:390px){.head h1{font-size:24px}.jack{min-width:100px}.pgrid{gap:3px}.p{height:126px}.p.one{height:154px}.wheel-label{font-size:28px}}</style></head><body><div id="root"></div><script>const API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-api';let S=null,type='normal',spinning=false,rotation=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const tok=()=>localStorage.getItem('nr_player')||'';const person=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="22" r="12" fill="#b5ab98"/><path d="M10 57c2-15 11-22 22-22s20 7 22 22" fill="#b5ab98"/></svg>`;async function req(method='GET',body){const r=await fetch(API,{method,headers:{'content-type':'application/json',...(tok()?{authorization:'Bearer '+tok()}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'エラー');return j}function av(x,cls='ava'){return `<div class="${cls} ava">${x?.avatar_url?`<img src="${esc(x.avatar_url)}" onerror="this.parentElement.innerHTML=decodeURIComponent('${encodeURIComponent(person)}')">`:person}</div>`}function login(msg=''){document.getElementById('root').innerHTML=`<main class="login"><section class="loginbox"><div class="ey">NOIR ROYALE</div><h1>PLAYER LOGIN</h1><form id="lf" class="form"><label>DISPLAY NAME<input id="nm" required></label><label>4 DIGIT PIN<input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label><button class="btn">ENTER</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></section></main>`;$('#lf').onsubmit=async e=>{e.preventDefault();try{const j=await req('POST',{action:'loginPlayer',displayName:$('#nm').value,pin:$('#pin').value});localStorage.setItem('nr_player',j.token);await load()}catch(x){login(x.message)}}}function polar(cx,cy,r,a){const q=(a-90)*Math.PI/180;return [cx+r*Math.cos(q),cy+r*Math.sin(q)]}function path(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),large=a1-a0>180?1:0;return `M ${cx} ${cy} L ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]} Z`}function wheel(items){if(!items.length)return '<div class="empty">ルーレット設定がありません</div>';const st=360/items.length;let g='';items.forEach((it,i)=>{const a0=i*st,a1=(i+1)*st,mid=a0+st/2,p=polar(500,500,330,mid),fill=i%2? '#0d1110':'#7d1822',f=it.rarity==='legend'?'#7a4b14':it.rarity==='epic'?'#4d1638':fill;const text=String(it.label).length>13?String(it.label).slice(0,12)+'…':it.label;g+=`<g><path d="${path(500,500,490,a0,a1)}" fill="${f}" stroke="#d1aa5a" stroke-width="4"/><text class="wheel-label" x="${p[0]}" y="${p[1]}" transform="rotate(${mid} ${p[0]} ${p[1]})">${esc(text)}</text></g>`});return `<div class="wheelwrap"><div class="pointer"></div><div class="wheel-shell"><svg class="wheel-svg" id="wheel" viewBox="0 0 1000 1000" style="transform:rotate(${rotation}deg)">${g}<circle cx="500" cy="500" r="150" fill="#1a120b" stroke="#cfa85a" stroke-width="18"/></svg><div class="hub">SPIN</div></div></div>`}function pod(x,n){return `<div class="p ${n===1?'one':''}">${av(x)}<div class="medal">${n}</div><b>${esc(x?.display_name||'OPEN')}</b><strong>${Number(x?.score||0).toLocaleString()}</strong></div>`}function render(){if(!S?.event)return login('開催中のイベントがありません');if(!S.player)return login();const p=S.player,lb=S.leaderboard||[],items=(S.items||[]).filter(x=>x.roulette_type===type);document.getElementById('root').innerHTML=`<main class="app"><header class="head" id="home"><div><div class="ey">LIMITED EVENT</div><h1>${esc(S.event.name)}</h1><div class="count" id="count"></div></div><div><div class="jack"><small>JACKPOT</small><strong>${Number(S.event.jackpot_current).toLocaleString()}</strong></div><div class="topbtns"><button class="tiny" id="logout">EXIT</button></div></div></header><section class="pod" id="rank"><div class="plabel">VIP RANKING</div><div class="pgrid">${pod(lb[1],2)}${pod(lb[0],1)}${pod(lb[2],3)}</div></section><section class="status"><div class="who">${av(p,'meava')}<div><small>${esc(p.display_name)}</small><p>あなたは現在 <strong>${p.rank||'—'}位</strong></p></div></div><div class="stats"><div class="stat"><small>SPIN PT</small><strong>${Number(p.spin_points).toLocaleString()}</strong></div><div class="stat"><small>SPECIAL</small><strong>${p.special_tickets}</strong></div><div class="stat"><small>SCORE</small><strong>${Number(p.score).toLocaleString()}</strong></div></div></section><section class="table" id="roulette"><div class="tabs"><button id="std" class="${type==='normal'?'on':''}">STANDARD</button><button id="spc" class="special ${type==='special'?'on':''}">SPECIAL</button></div>${wheel(items)}<div class="actions"><button class="spin" id="spin" ${spinning||p.spin_points<S.event.spin_cost?'disabled':''}><small>STANDARD</small><strong>${S.event.spin_cost}PTで回す</strong></button><button class="specialbtn" id="special" ${spinning||p.special_tickets<1?'disabled':''}><small>${p.special_tickets?'SPECIAL READY':'SPECIAL'}</small><strong>SPECIAL ROULETTE</strong></button></div><div id="er"></div></section><section class="panel"><div class="sect"><strong>リアルタイムランキング</strong><span>LIVE</span></div>${lb.slice(3,10).map((x,i)=>`<div class="row"><b>${i+4}位</b>${av(x,'mini')}<span>${esc(x.display_name)}</span><strong>${Number(x.score).toLocaleString()}</strong></div>`).join('')||'<div class="empty">4位以下はまだいません</div>'}</section><section class="mypage" id="mypage"><div class="sect"><strong>MY PAGE</strong><span>PROFILE</span></div><div class="profile">${av(p,'big')}<div><h3>${esc(p.display_name)}</h3><p>アイコンはランキングにも反映されます。</p><div class="myactions"><button class="ghost" id="chg">アイコン変更</button><button class="ghost" id="del">削除</button></div><input id="file" type="file" accept="image/*" hidden></div></div><div class="stats"><div class="stat"><small>CURRENT SCORE</small><strong>${Number(p.score).toLocaleString()}</strong></div><div class="stat"><small>CURRENT RANK</small><strong>${p.rank||'—'}位</strong></div><div class="stat"><small>SPECIAL</small><strong>${p.special_tickets}</strong></div></div><div class="recent"><div class="sect" style="margin-top:12px"><strong>最近の当選履歴</strong><span>HISTORY</span></div>${(S.playerHistory||[]).map(x=>`<div><span>${new Date(x.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><strong>${esc(x.item_label)}</strong></div>`).join('')||'<div class="empty">まだ履歴はありません</div>'}</div></section><nav class="nav"><a href="#home">HOME</a><a href="#rank">RANKING</a><a href="#roulette">ROULETTE</a><a href="#mypage">MY PAGE</a></nav></main>`;$('#logout').onclick=async()=>{try{await req('POST',{action:'logoutPlayer'})}catch{}localStorage.removeItem('nr_player');login()};$('#std').onclick=()=>{type='normal';render()};$('#spc').onclick=()=>{type='special';render()};$('#spin').onclick=()=>spin('normal');$('#special').onclick=()=>spin('special');$('#chg').onclick=()=>$('#file').click();$('#del').onclick=async()=>{try{await req('POST',{action:'removeAvatar'});await load(true)}catch(e){alert(e.message)}};$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=await resize(f);await req('POST',{action:'updateAvatar',imageData:d});await load(true)}catch(x){alert(x.message)}e.target.value=''};countdown()}function resize(file){return new Promise((res,rej)=>{const rd=new FileReader;rd.onload=()=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),sc=Math.max(256/im.width,256/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(256-w)/2,(256-h)/2,w,h);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}async function spin(t){if(spinning)return;spinning=true;type=t;render();try{const j=await req('POST',{action:'spin',type:t}),list=(S.items||[]).filter(x=>x.roulette_type===t),i=Math.max(0,list.findIndex(x=>String(x.id)===String(j.result.item.id))),st=360/Math.max(1,list.length),target=360-(i*st+st/2);rotation+=1440+target+(360-(rotation%360));const w=$('#wheel');if(w)requestAnimationFrame(()=>w.style.transform=`rotate(${rotation}deg)`);setTimeout(async()=>{spinning=false;await load(true);show(j.result)},2650)}catch(e){spinning=false;await load(true);const er=$('#er');if(er)er.innerHTML=`<div class="err">${esc(e.message)}</div>`}}function show(r){const art=r.item?.reward_image_url?`<div class="rewardart"><img src="${esc(r.item.reward_image_url)}" alt="${esc(r.item.label)}"></div>`:'';document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov"><div class="result"><small>${esc(String(r.item?.rarity||'WIN').toUpperCase())}</small>${art}<h2>${esc(r.item.label)}</h2><p>${esc(r.rewardText)}</p><p>TOTAL SCORE <strong>${Number(r.player.score).toLocaleString()}</strong></p><button id="ok">CONTINUE</button></div></div>`);$('#ok').onclick=()=>$('#ov').remove()}function countdown(){const e=S?.event?.ends_at;if(!e)return;const ms=new Date(e)-new Date(),el=$('#count');if(!el)return;if(ms<=0){el.textContent='EVENT ENDED';return}const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);el.textContent=`終了まで ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}async function load(silent=false){try{S=await req();render()}catch(e){if(!silent){localStorage.removeItem('nr_player');login(e.message)}}}load();setInterval(()=>{if(!spinning&&S?.player)load(true)},3000);setInterval(countdown,1000);</script></body></html>
