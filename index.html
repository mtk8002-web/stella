tion:relative;min-width:0;border:1px solid #d7ad5830;border-radius:11px;overflow:hidden;background:linear-gradient(#15110d,#080807)}.prizeImg{aspect-ratio:1;background:#090907;display:grid;place-items:center;color:#c8a85f;font:800 12px Georgia}.prizeImg img{width:100%;height:100%;object-fit:contain}.prizeInfo{padding:8px}.prizeInfo b{display:block;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prizeInfo small{font-size:7px;color:#867d6f}.qty{position:absolute;right:5px;top:5px;z-index:2;padding:4px 7px;border-radius:999px;background:#8f1d28;color:#ffe8ad;border:1px solid #e8bd62;font:800 10px Georgia;box-shadow:0 0 10px #c22e3b55}.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:#070807ed;border-top:1px solid #d7ad5830;backdrop-filter:blur(12px)}.nav a{text-decoration:none;color:#8c8374;display:grid;place-items:center;font-size:8px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#050605}.loginbox{width:min(420px,100%);padding:26px;border:1px solid #d7ad5840;border-radius:16px;background:linear-gradient(#11160f,#080807)}.login h1{font:600 31px Georgia;color:#f0d082}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;font-size:8px;color:#9b907c}.form input{padding:12px;border:1px solid #d7ad5830;border-radius:9px;background:#070907;color:#fff}.btn{padding:12px;border:1px solid #d9b25f;border-radius:999px;background:linear-gradient(#e9c874,#a7762d);color:#130e06;font-weight:900}.err{margin-top:9px;padding:9px;border:1px solid #9a3b46;border-radius:8px;background:#351018;color:#efb9bd;font-size:9px}.overlay{position:fixed;z-index:100;inset:0;background:#000e;display:grid;place-items:center;padding:18px}.result{width:min(390px,100%);padding:24px;text-align:center;border:1px solid #d8ae5d;border-radius:18px;background:radial-gradient(circle at 50% 20%,#7a4e2030,transparent 36%),linear-gradient(#18130e,#080706);box-shadow:0 0 60px #d6a64f30;position:relative;overflow:hidden}.result.jpwin{border:2px solid #ffe079;background:radial-gradient(circle at 50% 25%,#ffce4360,transparent 35%),radial-gradient(circle at 50% 60%,#8d260d65,transparent 55%),linear-gradient(#3d1607,#0c0603);box-shadow:0 0 90px #ffc13b65}.jpwin:before,.jpwin:after{content:"";position:absolute;width:520px;height:60px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(25deg);background:linear-gradient(90deg,transparent,#ffd55b22,transparent);animation:rays 1.8s linear infinite}.jpwin:after{transform:translate(-50%,-50%) rotate(-25deg);animation-delay:.7s}@keyframes rays{50%{opacity:.25;transform:translate(-50%,-50%) rotate(205deg)}to{transform:translate(-50%,-50%) rotate(385deg)}}.result small{font-size:9px;letter-spacing:.2em;color:#d2aa57}.jpwin small{color:#ffe995;text-shadow:0 0 8px #ffd044}.result h2{font:600 30px Georgia;color:#f5d58b;margin:12px 0 5px;position:relative}.jpwin h2{font-size:42px;color:#fff0a0;text-shadow:0 0 14px #ffcb44}.result p{margin:6px 0;color:#c7bca5;position:relative}.result button{margin-top:15px;padding:10px 22px;border:1px solid #d9b25f;border-radius:999px;background:linear-gradient(#e9c874,#a7762d);color:#130e06;font-weight:900;position:relative}.rewardart{width:190px;height:190px;margin:12px auto;border-radius:18px;overflow:hidden;border:1px solid #e0b96755;background:#090907;position:relative}.rewardart img{width:100%;height:100%;object-fit:contain}.empty{text-align:center;color:#746b5e;padding:13px;font-size:9px}@media(max-width:390px){.heroText h1{font-size:25px}.head{align-items:center}.jack{min-width:120px}.pgrid{gap:3px}.p{height:126px}.p.one{height:154px}.wheel-label{font-size:27px}.jack-label{font-size:32px}.collection{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div>
<script>
const root=document.getElementById('root');const API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-api';let S=null,type='normal',spinning=false,rotation=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const tok=()=>localStorage.getItem('nr_player')||'';const person=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="22" r="12" fill="#b5ab98"/><path d="M10 57c2-15 11-22 22-22s20 7 22 22" fill="#b5ab98"/></svg>`;
async function req(method='GET',body){const r=await fetch(API,{method,headers:{'content-type':'application/json',...(tok()?{authorization:'Bearer '+tok()}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'エラー');return j}
function av(x,cls='ava'){return `<div class="${cls} ava">${x?.avatar_url?`<img src="${esc(x.avatar_url)}" onerror="this.parentElement.innerHTML=decodeURIComponent('${encodeURIComponent(person)}')">`:person}</div>`}
function login(msg=''){root.innerHTML=`<main class="login"><section class="loginbox"><div class="ey">NOIR ROYALE</div><h1>PLAYER LOGIN</h1><form id="lf" class="form"><label>DISPLAY NAME<input id="nm" required></label><label>4 DIGIT PIN<input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label><button class="btn">ENTER</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></section></main>`;$('#lf').onsubmit=async e=>{e.preventDefault();try{const j=await req('POST',{action:'loginPlayer',displayName:$('#nm').value,pin:$('#pin').value});localStorage.setItem('nr_player',j.token);await load()}catch(x){login(x.message)}}}
function polar(cx,cy,r,a){const q=(a-90)*Math.PI/180;return [cx+r*Math.cos(q),cy+r*Math.sin(q)]}
function path(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),large=a1-a0>180?1:0;return `M ${cx} ${cy} L ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]} Z`}
function wheel(items){if(!items.length)return '<div class="empty">ルーレット設定がありません</div>';const st=360/items.length;let g='';items.forEach((it,i)=>{const a0=i*st,a1=(i+1)*st,mid=a0+st/2,p=polar(500,500,330,mid),isJ=it.reward_kind==='jackpot',fill=isJ?'url(#jackGrad)':it.rarity==='legend'?'#7a4b14':it.rarity==='epic'?'#4d1638':i%2?'#0d1110':'#7d1822',stroke=isJ?'#fff1a0':'#d1aa5a',sw=isJ?10:4,text=isJ?'★ JACKPOT ★':String(it.label).length>13?String(it.label).slice(0,12)+'…':it.label;g+=`<g><path d="${path(500,500,490,a0,a1)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${isJ?'filter="url(#jackGlow)"':''}/><text class="wheel-label ${isJ?'jack-label':''}" x="${p[0]}" y="${p[1]}" transform="rotate(${mid} ${p[0]} ${p[1]})">${esc(text)}</text>${isJ?`<circle class="jack-star" cx="${polar(500,500,420,mid-4)[0]}" cy="${polar(500,500,420,mid-4)[1]}" r="10"/>`:''}</g>`});return `<div class="wheelwrap"><div class="pointer"></div><div class="wheel-shell"><svg class="wheel-svg" id="wheel" viewBox="0 0 1000 1000" style="transform:rotate(${rotation}deg)"><defs><linearGradient id="jackGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5a1304"/><stop offset=".35" stop-color="#ffb51e"/><stop offset=".55" stop-color="#fff0a2"/><stop offset=".75" stop-color="#ff8a00"/><stop offset="1" stop-color="#5e1002"/></linearGradient><filter id="jackGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${g}<circle cx="500" cy="500" r="150" fill="#1a120b" stroke="#cfa85a" stroke-width="18"/></svg><div class="hub">SPIN</div></div></div>`}
function pod(x,n){return `<div class="p ${n===1?'one':''}">${av(x)}<div class="medal">${n}</div><b>${esc(x?.display_name||'OPEN')}</b><strong>${Number(x?.score||0).toLocaleString()}</strong></div>`}
function tickerMessages(){const defs=['JACKPOT GROWING — 通常SPINごとにプールが加算されます','VIP RANKING LIVE — SCOREはリアルタイムで更新','SPECIAL ROULETTE — SPECIAL TICKETで挑戦','NEXT ×2 / ×3 — 次回SCORE獲得時に倍率適用'];const jp=(S.recent||[]).find(r=>r.reward_kind==='jackpot'&&Date.now()-new Date(r.created_at).getTime()<6*3600e3);return jp?[`JACKPOT!! ${jp.players?.display_name||'PLAYER'} さんが ${Number(jp.score_awarded||0).toLocaleString()} SCORE獲得！おめでとう！`,...defs]:defs}
function ticker(){const msgs=tickerMessages(),one=msgs.map((m,i)=>`<span class="tick ${i===0&&m.startsWith('JACKPOT!!')?'jp':''}"><span class="dot"></span>${esc(m)}</span>`).join('');return `<div class="ticker"><div class="tickerTrack"><div class="tickerGroup">${one}</div><div class="tickerGroup">${one}</div></div></div>`}
function collection(){const c=S.prizeCollection||[];if(!c.length)return '<div class="empty">まだ景品を獲得していません</div>';return `<div class="collection">${c.map(x=>`<div class="prize">${x.count>1?`<span class="qty">×${x.count}</span>`:''}<div class="prizeImg">${x.reward_image_url?`<img src="${esc(x.reward_image_url)}">`:fallbackPrize(x)}</div><div class="prizeInfo"><b>${esc(x.item_label)}</b><small>${esc(kindLabel(x.reward_kind))}</small></div></div>`).join('')}</div>`}
function fallbackPrize(x){return x.reward_kind==='jackpot'?'JACKPOT':x.reward_kind==='multiplier'?`×${x.item_value}`:x.reward_kind==='special_ticket'?'SPECIAL':x.reward_kind==='free_spin'?'FREE':`${Number(x.item_value||0)}<br>SCORE`}
function kindLabel(k){return {score:'SCORE',multiplier:'NEXT MULTIPLIER',free_spin:'FREE SPIN',special_ticket:'SPECIAL TICKET',jackpot:'JACKPOT',collection:'COLLECTION'}[k]||k}
function render(){if(!S?.event)return login('開催中のイベントがありません');if(!S.player)return login();const p=S.player,lb=S.leaderboard||[],items=(S.items||[]).filter(x=>x.roulette_type===type),e=S.event;root.innerHTML=`<main class="app"><section class="hero" id="home">${e.header_image_url?`<img src="${esc(e.header_image_url)}">`:'<div class="heroFallback">NOIR ROYALE</div>'}<div class="heroText"><div class="ey">LIMITED EVENT</div><h1>${esc(e.name)}</h1></div></section>${ticker()}<header class="head"><div><h2>${esc(e.name)}</h2><div class="count" id="count"></div></div><div><div class="jack"><small>JACKPOT</small><strong>${Number(e.jackpot_current).toLocaleString()}</strong></div><div class="topbtns"><button class="tiny" id="logout">EXIT</button></div></div></header><section class="pod" id="rank"><div class="plabel">VIP RANKING</div><div class="pgrid">${pod(lb[1],2)}${pod(lb[0],1)}${pod(lb[2],3)}</div></section><section class="status"><div class="who">${av(p,'meava')}<div><small>${esc(p.display_name)}</small><p>あなたは現在 <strong>${p.rank||'—'}位</strong></p></div></div><div class="stats"><div class="stat"><small>SPIN PT</small><strong>${Number(p.spin_points).toLocaleString()}</strong></div><div class="stat"><small>SPECIAL</small><strong>${p.special_tickets}</strong></div><div class="stat"><small>SCORE</small><strong>${Number(p.score).toLocaleString()}</strong></div></div></section><section class="table" id="roulette"><div class="tabs"><button id="std" class="${type==='normal'?'on':''}">STANDARD</button><button id="spc" class="special ${type==='special'?'on':''}">SPECIAL</button></div>${wheel(items)}<div class="actions"><button class="spin" id="spin" ${spinning||p.spin_points<e.spin_cost?'disabled':''}><small>STANDARD</small><strong>${e.spin_cost}PTで回す</strong></button><button class="specialbtn" id="special" ${spinning||p.special_tickets<1?'disabled':''}><small>${p.special_tickets?'SPECIAL READY':'SPECIAL'}</small><strong>SPECIAL ROULETTE</strong></button></div><div id="er"></div></section><section class="panel"><div class="sect"><strong>リアルタイムランキング</strong><span>LIVE</span></div>${lb.slice(3,10).map((x,i)=>`<div class="row"><b>${i+4}位</b>${av(x,'mini')}<span>${esc(x.display_name)}</span><strong>${Number(x.score).toLocaleString()}</strong></div>`).join('')||'<div class="empty">4位以下はまだいません</div>'}</section><section class="mypage" id="mypage"><div class="sect"><strong>MY PAGE</strong><span>PROFILE</span></div><div class="profile">${av(p,'big')}<div><h3>${esc(p.display_name)}</h3><p>アイコンはランキングにも反映されます。</p><div class="myactions"><button class="ghost" id="chg">アイコン変更</button><button class="ghost" id="del">削除</button></div><input id="file" type="file" accept="image/*" hidden></div></div><div class="stats"><div class="stat"><small>CURRENT SCORE</small><strong>${Number(p.score).toLocaleString()}</strong></div><div class="stat"><small>CURRENT RANK</small><strong>${p.rank||'—'}位</strong></div><div class="stat"><small>SPECIAL</small><strong>${p.special_tickets}</strong></div></div><div class="sect" style="margin-top:16px"><strong>PRIZE COLLECTION</strong><span>${(S.prizeCollection||[]).length} TYPES</span></div>${collection()}<div class="recent"><div class="sect" style="margin-top:16px"><strong>最近の当選履歴</strong><span>HISTORY</span></div>${(S.playerHistory||[]).map(x=>`<div><span>${new Date(x.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><strong>${esc(x.item_label)}</strong></div>`).join('')||'<div class="empty">まだ履歴はありません</div>'}</div></section><nav class="nav"><a href="#home">HOME</a><a href="#rank">RANKING</a><a href="#roulette">ROULETTE</a><a href="#mypage">MY PAGE</a></nav></main>`;bind();countdown()}
function bind(){
$('#logout').onclick=async()=>{try{await req('POST',{action:'logoutPlayer'})}catch{}localStorage.removeItem('nr_player');login()};$('#std').onclick=()=>{type='normal';render()};$('#spc').onclick=()=>{type='special';render()};$('#spin').onclick=()=>spin('normal');$('#special').onclick=()=>spin('special');$('#chg').onclick=()=>$('#file').click();$('#del').onclick=async()=>{try{await req('POST',{action:'removeAvatar'});await load(true)}catch(e){alert(e.message)}};$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=await resize(f);await req('POST',{action:'updateAvatar',imageData:d});await load(true)}catch(x){alert(x.message)}e.target.value=''}
}
function resize(file){return new Promise((res,rej)=>{const rd=new FileReader;rd.onload=()=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),sc=Math.max(256/im.width,256/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(256-w)/2,(256-h)/2,w,h);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
async function spin(t){if(spinning)return;spinning=true;type=t;render();try{const j=await req('POST',{action:'spin',type:t}),list=(S.items||[]).filter(x=>x.roulette_type===t),i=Math.max(0,list.findIndex(x=>String(x.id)===String(j.result.item.id))),st=360/Math.max(1,list.length),target=360-(i*st+st/2);rotation+=1440+target+(360-(rotation%360));const w=$('#wheel');if(w)requestAnimationFrame(()=>w.style.transform=`rotate(${rotation}deg)`);setTimeout(async()=>{spinning=false;await load(true);show(j.result)},2650)}catch(e){spinning=false;await load(true);const er=$('#er');if(er)er.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function show(r){const isJ=r.item?.reward_kind==='jackpot',art=r.item?.reward_image_url?`<div class="rewardart"><img src="${esc(r.item.reward_image_url)}" alt="${esc(r.item.label)}"></div>`:'';document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov"><div class="result ${isJ?'jpwin':''}"><small>${isJ?'JACKPOT WINNER':esc(String(r.item?.rarity||'WIN').toUpperCase())}</small>${art}<h2>${isJ?'JACKPOT!':esc(r.item.label)}</h2><p>${esc(r.rewardText)}</p><p>TOTAL SCORE <strong>${Number(r.player.score).toLocaleString()}</strong></p><button id="ok">CONTINUE</button></div></div>`);$('#ok').onclick=()=>$('#ov').remove()}
function countdown(){const e=S?.event?.ends_at;if(!e)return;const ms=new Date(e)-new Date(),el=$('#count');if(!el)return;if(ms<=0){el.textContent='EVENT ENDED';return}const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);el.textContent=`終了まで ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
async function load(silent=false){try{S=await req();render()}catch(e){if(!silent){localStorage.removeItem('nr_player');login(e.message)}}}
load();setInterval(()=>{if(!spinning&&S?.player)load(true)},3000);setInterval(countdown,1000);
</script></body></html>
