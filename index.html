<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070907"><title>Noir Royale</title><style>
*{box-sizing:border-box}html{background:#050605;color-scheme:dark;scroll-behavior:smooth}body{margin:0;color:#f4ead0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#050605}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:0 13px 88px;background:radial-gradient(circle at 50% 4%,#5d152033,transparent 24%),radial-gradient(circle at 50% 55%,#0c5b3f42,transparent 33%),linear-gradient(180deg,#080706,#07100c 54%,#050605);box-shadow:0 0 80px #0008;overflow:hidden}.head{min-height:112px;padding:22px 1px 12px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:9px;border-bottom:1px solid #d6ad583d;position:relative}.head h1{font:600 clamp(23px,7vw,34px)/1 Georgia,serif;letter-spacing:.05em;color:#f3d58b;margin:4px 0 0}.eyebrow{font-size:8px;letter-spacing:.3em;color:#bd9850;font-weight:800}.jack{min-width:112px;padding:8px 11px;border:1px solid #e4b85fa6;border-radius:10px;text-align:center;background:linear-gradient(#4a151c,#19090c);box-shadow:0 0 18px #d49a351f}.jack small{display:block;font:700 9px Georgia;color:#e9c779}.jack strong{display:block;font:600 25px Georgia;color:#ffdda0}.exit{position:absolute;right:0;top:9px;border:0;background:none;color:#7c7466;font-size:8px;letter-spacing:.15em}.podium{padding:20px 3px 5px}.plabel{text-align:center;font:700 9px Georgia;color:#d2af63;letter-spacing:.25em;margin-bottom:12px}.pgrid{display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:4px;min-height:178px}.p{height:140px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:51px 4px 13px;border:1px solid #c79c4e55;border-radius:54px 54px 10px 10px;background:linear-gradient(#221b16c8,#090807);box-shadow:0 12px 24px #0006}.p.one{height:170px;border-color:#edc466c2;background:radial-gradient(circle at 50% 15%,#a66c243d,transparent 34%),linear-gradient(#4a2b10e8,#160c07)}.p.two{border-color:#c9c9c06e}.p.three{border-color:#b8794c70}.ava{position:absolute;top:-4px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#294238,#080b09 70%);border:3px solid #a17b3c;font:600 18px Georgia;color:#f4e5bf;box-shadow:0 0 0 3px #090807}.one .ava{top:-8px;width:80px;height:80px;border-color:#e4ba61;box-shadow:0 0 0 4px #211306,0 0 0 5px #e2b95b66}.two .ava{border-color:#c2c2bc}.three .ava{border-color:#b87750}.medal{position:absolute;top:54px;min-width:42px;padding:3px 9px;border-radius:999px;text-align:center;font:700 15px Georgia;color:#0c0906;background:linear-gradient(#f0cd76,#996725);border:1px solid #f3d48f}.one .medal{top:65px;font-size:17px}.two .medal{background:linear-gradient(#e5e3dc,#898b88)}.three .medal{background:linear-gradient(#dc9d70,#875337)}.p b{font:500 13px Georgia;color:#efe2c7;max-width:100%;overflow:hidden;text-overflow:ellipsis}.one b{font-size:15px}.p>strong{font:600 22px Georgia;color:#f3d38a;margin-top:3px}.one>strong{font-size:29px}.p small{font-size:6px;color:#837967;letter-spacing:.15em}.crown{position:absolute;top:-30px;width:46px;height:24px;border-bottom:6px solid #dbae50}.crown:before{content:"";position:absolute;left:4px;bottom:2px;width:34px;height:25px;background:linear-gradient(135deg,#ffe096,#aa7426);clip-path:polygon(0 100%,12% 18%,35% 68%,50% 0,66% 68%,88% 18%,100% 100%)}.status{margin-top:6px;padding:13px;border:1px solid #dfb7628f;border-radius:14px;background:linear-gradient(145deg,#0c1712f7,#070807);box-shadow:inset 0 0 0 2px #50371444,0 13px 32px #0006}.who{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #e5bf761f}.meava{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;border:2px solid #c69647;background:#18130f;font:600 12px Georgia}.who small{display:block;font-size:8px;color:#938a79}.who p{margin:0;font-size:12px;color:#d8cfbc}.who p strong{font:600 24px Georgia;color:#f0ce82;margin-left:4px}.gaps{display:grid;grid-template-columns:1fr 1fr;margin:10px 0;padding-bottom:9px;border-bottom:1px solid #e5bf761a}.gaps div{display:grid;place-items:center}.gaps div+div{border-left:1px solid #e5bf762c}.gaps small{font-size:8px;color:#9a917f}.gaps strong{font:600 22px Georgia;color:#efce81}.gaps span{font-size:7px;color:#a98b51}.res{display:flex;align-items:center;gap:15px}.res div{display:grid;grid-template-columns:30px auto;grid-template-rows:auto auto;column-gap:7px;align-items:center}.badge{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px dashed #d0a552;background:radial-gradient(circle,#7d5d26,#2d1c0a 68%);font:bold 9px Georgia}.res small{font-size:7px;color:#978d7a}.res strong{font:600 16px Georgia;color:#edcd81}.boost{margin-left:auto!important;display:block!important;padding:7px 9px;border:1px solid #d5a95466;border-radius:999px;background:#36141a;color:#ecc975;font-size:8px}.table{margin-top:15px;padding:16px 8px 14px;border:1px solid #dcb7624d;border-radius:18px;background:radial-gradient(circle at 50% 43%,#14583f70,transparent 50%),linear-gradient(#062b1e,#04140e);box-shadow:0 18px 42px #0007;overflow:hidden}.tabs{width:225px;margin:auto;padding:3px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddb96d33;border-radius:999px;background:#07130e}.tabs button{border:0;background:none;color:#7d7668;border-radius:999px;padding:7px;font-size:7px;letter-spacing:.13em}.tabs .on{background:linear-gradient(#19553e,#0a2b1f);color:#f1deb5}.tabs .on.special{background:linear-gradient(#6b232e,#340e14)}.wheelwrap{width:min(78vw,385px);aspect-ratio:1;margin:34px auto 28px;position:relative;filter:drop-shadow(0 28px 38px #000a)}.wheelwrap:before{content:"";position:absolute;inset:-15px;border-radius:50%;border:7px solid #17100a;box-shadow:inset 0 0 0 2px #c79b52,inset 0 0 0 6px #4a3118,0 0 0 2px #e0bc72;background:linear-gradient(135deg,#704b21,#d0a75d 45%,#5d3b18);z-index:-1}.pointer{position:absolute;z-index:5;left:50%;top:-24px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #edc56d;filter:drop-shadow(0 3px #6f4b1c)}.wheel{width:100%;height:100%;border-radius:50%;position:relative;border:2px solid #dfbd77;box-shadow:inset 0 0 0 7px #100d09,inset 0 0 0 10px #e0bd7794,inset 0 0 0 12px #342313,inset 0 0 70px #0009;transition:transform 2.6s cubic-bezier(.13,.72,.12,1)}.wl{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}.wl span{display:block;margin-top:7%;width:66px;text-align:center;font:600 8px Georgia;color:#f7e7c3;text-shadow:0 1px 3px #000;line-height:1.05}.hub{position:absolute;inset:39%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#e0bb6c 0 8%,#88612a 24%,#20140b 67%,#080706 74%);border:2px solid #edcf88;box-shadow:0 0 0 5px #24170b,0 0 0 7px #bd8f46;color:#ffe6ae;font:600 11px Georgia;letter-spacing:.12em}.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}.spin,.specialbtn{min-height:60px;border-radius:13px;border:1px solid #dcab55;padding:8px 9px;color:#ffe3a2;display:grid;place-items:center}.spin{background:linear-gradient(#a62630,#72131d 54%,#3f0a10)}.specialbtn{background:linear-gradient(#211b12,#090907 70%);color:#f3d48b}.actions small{font-size:7px;letter-spacing:.17em;opacity:.7}.actions strong{font:600 17px Georgia}.specialbtn strong{font-size:10px}.actions button:disabled{opacity:.35}.panel{margin-top:13px;padding:12px;border:1px solid #ddb9693d;border-radius:13px;background:linear-gradient(145deg,#0b0f0c,#060807)}.sect{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid #e2bd6a1c}.sect strong{font-size:10px}.sect span{font-size:7px;color:#d05b60;letter-spacing:.13em}.row{display:grid;grid-template-columns:34px 28px 1fr auto;gap:7px;align-items:center;padding:9px 3px;border-bottom:1px solid #e2bd6a12}.row.me{margin:3px -4px;padding-left:7px;padding-right:7px;border:1px solid #d8ab5055;border-radius:8px;background:linear-gradient(90deg,#78521d2e,transparent)}.row b{font:600 11px Georgia;color:#c4ad76}.mini{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1px solid #d1a95670;background:#121512;font-size:8px}.row span{font-size:10px}.row strong{font:600 14px Georgia;color:#efcf86}.recent div{display:flex;justify-content:space-between;padding:9px 3px;border-bottom:1px solid #e2bd6a10;font-size:9px}.recent span{color:#918878}.recent strong{color:#dfc995}.empty{text-align:center;padding:15px;color:#71695d;font-size:9px}.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:70px;padding:8px 11px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#050706f2;border-top:1px solid #ddb9693d;backdrop-filter:blur(18px)}.nav a{display:grid;place-items:center;text-decoration:none;color:#7e7463;font-size:7px;letter-spacing:.08em}.nav i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid #d5aa5433;font:600 8px Georgia;color:#c9a75c;font-style:normal}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(430px,100%);padding:28px;border:1px solid #d8ae5955;border-radius:16px;background:linear-gradient(145deg,#111611,#070807);box-shadow:0 25px 80px #0009}.loginbox h1{font:600 29px Georgia;color:#f1d28b;margin:4px 0 22px}.loginbox label{display:grid;gap:6px;margin:12px 0;font-size:8px;letter-spacing:.13em;color:#a79c86}.loginbox input{width:100%;padding:13px;border-radius:9px;border:1px solid #d7ad5838;background:#080a08;color:#f4ead0;outline:none}.goldbtn{width:100%;padding:13px;border-radius:999px;border:1px solid #e2bd6c;background:linear-gradient(#f0d287,#b98839);color:#160f07;font-weight:900;letter-spacing:.12em;margin-top:8px}.err{margin-top:9px;padding:9px;border:1px solid #bd4b5170;border-radius:8px;background:#60141d3d;color:#efb9bc;font-size:10px}.overlay{position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:22px;background:#020403e8}.result{width:min(390px,100%);padding:28px;text-align:center;border:2px solid #dfba65;border-radius:18px;background:radial-gradient(circle at 50% 0%,#722b343d,transparent 35%),linear-gradient(160deg,#102b21,#070b09 70%);box-shadow:0 0 90px #dbad4c33}.result small{color:#c29e50;letter-spacing:.24em}.result h2{font:600 39px Georgia;color:#ffe0a0;margin:13px 0}.result p{color:#cbbda2}.result button{margin-top:15px;width:100%;padding:12px;border-radius:999px;border:1px solid #e2bd6c;background:linear-gradient(#f0d287,#b98839);color:#160f07;font-weight:900}@media(max-width:380px){.app{padding-left:9px;padding-right:9px}.head h1{font-size:21px}.jack{min-width:100px}.p{height:132px}.p.one{height:158px}.p b{font-size:11px}.p>strong{font-size:19px}.one>strong{font-size:25px}.actions strong{font-size:15px}.specialbtn strong{font-size:9px}}
</style></head><body><div id="root"></div><script>
const API='https://miajuashbnhcqpzkxxnw.supabase.co/functions/v1/roulette-api';let S=null,rotation=0,spinning=false,type='normal';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ini=n=>esc(String(n||'?').trim().slice(0,2).toUpperCase());const token=()=>localStorage.getItem('nr_player')||'';
async function req(method='GET',body){const r=await fetch(API,{method,headers:{'content-type':'application/json',...(token()?{authorization:'Bearer '+token()}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'エラー');return j}
async function load(silent=false){try{S=await req();render()}catch(e){if(!silent){localStorage.removeItem('nr_player');loginView(e.message)}}}
function podium(x,p){if(!x)return `<div class="p ${p===1?'one':p===2?'two':'three'}"><div class="ava">—</div><div class="medal">${p}</div><b>OPEN</b><strong>0</strong><small>SCORE</small></div>`;return `<div class="p ${p===1?'one':p===2?'two':'three'}">${p===1?'<div class="crown"></div>':''}<div class="ava">${ini(x.display_name)}</div><div class="medal">${p}</div><b>${esc(x.display_name)}</b><strong>${Number(x.score).toLocaleString()}</strong><small>SCORE</small></div>`}
function loginView(err=''){document.getElementById('root').innerHTML=`<main class="login"><section class="loginbox"><div class="eyebrow">PRIVATE EVENT</div><h1>NOIR ROYALE</h1><form id="loginf"><label>DISPLAY NAME<input id="dn" placeholder="表示名" required></label><label>ACCESS PIN<input id="pin" placeholder="0000" inputmode="numeric" maxlength="4" required></label><div id="le">${err?'<div class="err">'+esc(err)+'</div>':''}</div><button class="goldbtn">ENTER</button></form></section></main>`;$('#loginf').onsubmit=async e=>{e.preventDefault();try{const j=await req('POST',{action:'loginPlayer',displayName:$('#dn').value,pin:$('#pin').value});localStorage.setItem('nr_player',j.token);load()}catch(x){$('#le').innerHTML='<div class="err">'+esc(x.message)+'</div>'}}}
function wheel(items){const n=Math.max(items.length,1),step=360/n;const colors=items.map((it,i)=>it.rarity==='legend'?'#0b5a3d':it.rarity==='epic'?(i%2?'#5d0d17':'#a51727'):(i%2?'#090909':'#7d101d'));const grad=items.length?'conic-gradient('+items.map((_,i)=>`${colors[i]} ${i*step}deg ${(i+1)*step}deg`).join(',')+')':'#1a0c0f';return `<div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel" style="background:${grad};transform:rotate(${rotation}deg)">${items.map((it,i)=>{const a=i*step+step/2;return `<div class="wl" style="transform:rotate(${a}deg)"><span style="transform:rotate(${-a}deg)">${esc(it.label)}</span></div>`}).join('')}<div class="hub">SPIN</div></div></div>`}
function render(){if(!S?.event){loginView('イベント開催前です');return}if(!S.player){loginView();return}const p=S.player,top=S.leaderboard||[],idx=top.findIndex(x=>x.id===p.id),next=idx>0?top[idx-1]:null,nextGap=next?Math.max(0,next.score-p.score+1):0,leaderGap=top[0]&&top[0].id!==p.id?Math.max(0,top[0].score-p.score+1):0,items=(S.items||[]).filter(x=>x.roulette_type===type&&x.active);document.getElementById('root').innerHTML=`<main class="app"><header class="head" id="home"><div><div class="eyebrow">LIMITED EVENT</div><h1>${esc(S.event.name)}</h1></div><div class="jack"><small>JACKPOT</small><strong>${Number(S.event.jackpot_current).toLocaleString()}</strong></div><button class="exit" id="logout">EXIT</button></header><section class="podium" id="ranking"><div class="plabel">VIP RANKING</div><div class="pgrid">${podium(top[1],2)}${podium(top[0],1)}${podium(top[2],3)}</div></section><section class="status"><div class="who"><div class="meava">${ini(p.display_name)}</div><div><small>${esc(p.display_name)}</small><p>あなたは現在 <strong>${p.rank?p.rank+'位':'—'}</strong></p></div></div><div class="gaps"><div><small>次の順位まで</small><strong>${p.rank===1?'TOP':nextGap.toLocaleString()}</strong>${p.rank!==1?'<span>SCORE</span>':''}</div><div><small>1位まで</small><strong>${p.rank===1?'TOP':leaderGap.toLocaleString()}</strong>${p.rank!==1?'<span>SCORE</span>':''}</div></div><div class="res"><div><span class="badge">P</span><small>SPIN PT</small><strong>${Number(p.spin_points).toLocaleString()}</strong></div><div><span class="badge">S</span><small>SPECIAL</small><strong>${p.special_tickets}</strong></div>${p.pending_multiplier>1?`<div class="boost">NEXT ×${p.pending_multiplier}</div>`:''}</div></section><section class="table" id="roulette"><div class="tabs"><button id="std" class="${type==='normal'?'on':''}">STANDARD</button><button id="spc" class="${type==='special'?'on special':''}">SPECIAL</button></div>${wheel(items)}<div class="actions"><button class="spin" id="spin" ${spinning||p.spin_points<S.event.spin_cost?'disabled':''}><small>STANDARD</small><strong>${S.event.spin_cost}PTで回す</strong></button><button class="specialbtn" id="special" ${spinning||p.special_tickets<1?'disabled':''}><small>SPECIAL</small><strong>SPECIAL ROULETTE</strong></button></div><div id="err"></div></section><section class="panel"><div class="sect"><strong>リアルタイムランキング</strong><span>LIVE</span></div>${top.slice(3,10).map((x,i)=>`<div class="row ${x.id===p.id?'me':''}"><b>${i+4}位</b><div class="mini">${ini(x.display_name)}</div><span>${esc(x.display_name)}</span><strong>${Number(x.score).toLocaleString()}</strong></div>`).join('')||'<div class="empty">4位以下の参加者はまだいません。</div>'}</section><section class="panel recent" id="history"><div class="sect"><strong>直近の結果</strong><span>AUTO</span></div>${(S.recent||[]).slice(0,5).map(x=>`<div><span>${esc(x.players?.display_name||'PLAYER')}</span><strong>${esc(x.item_label)}</strong></div>`).join('')||'<div class="empty">まだ結果はありません。</div>'}</section><nav class="nav"><a href="#home"><i>01</i>HOME</a><a href="#ranking"><i>02</i>RANKING</a><a href="#roulette"><i>03</i>ROULETTE</a><a href="#history"><i>04</i>HISTORY</a></nav></main>`;$('#logout').onclick=async()=>{try{await req('POST',{action:'logoutPlayer'})}catch{}localStorage.removeItem('nr_player');loginView()};$('#std').onclick=()=>{type='normal';render()};$('#spc').onclick=()=>{type='special';render()};$('#spin').onclick=()=>spin('normal');$('#special').onclick=()=>spin('special')}
async function spin(t){if(spinning)return;spinning=true;type=t;render();try{const j=await req('POST',{action:'spin',type:t});const list=(S.items||[]).filter(x=>x.roulette_type===t&&x.active),i=Math.max(0,list.findIndex(x=>x.id===j.result.item.id)),step=360/Math.max(list.length,1),target=360-(i*step+step/2);rotation+=1440+target+(360-(rotation%360));const w=$('#wheel');if(w)requestAnimationFrame(()=>w.style.transform=`rotate(${rotation}deg)`);setTimeout(async()=>{spinning=false;await load(true);showResult(j.result)},2600)}catch(e){spinning=false;await load(true);const er=$('#err');if(er)er.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function showResult(r){document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov"><div class="result"><small>${esc(r.item.rarity).toUpperCase()}</small><h2>${esc(r.item.label)}</h2><p>${esc(r.rewardText)}</p><p>TOTAL SCORE <strong>${Number(r.player.score).toLocaleString()}</strong></p><button id="close">CONTINUE</button></div></div>`);$('#close').onclick=()=>$('#ov').remove()}
load();setInterval(()=>{if(!spinning&&S?.player)load(true)},3000);
</script></body></html>
